<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistant déclaration frontaliers</title>
  <meta name="description" content="Checklist personnalisée des formulaires et pièces pour votre déclaration française de frontalier.">
  <style>
    :root { --bg:#f7f8fa; --fg:#1b1f24; --muted:#5b6670; --card:#fff; --accent:#1a5fd0; --line:#dde2e8; --warn:#8a5a00; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14171a; --fg:#e8ebee; --muted:#9aa5b0; --card:#1d2227; --accent:#6ea2ff; --line:#2c333a; --warn:#e0b050; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
    main { max-width:680px; margin:0 auto; padding:24px 16px 64px; }
    h1 { font-size:1.5rem; margin:0 0 4px; }
    .lead { color:var(--muted); margin:0 0 24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; }
    .q { font-weight:600; margin:0 0 12px; }
    .opts { display:flex; flex-wrap:wrap; gap:8px; }
    button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
    button:hover { border-color:var(--accent); }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    button.sel { border-color:var(--accent); outline:2px solid var(--accent); }
    .step { color:var(--muted); font-size:.85rem; margin-bottom:6px; }
    .rule h3 { margin:0 0 6px; font-size:1.02rem; }
    .rule p { margin:0 0 8px; }
    .badge { display:inline-block; font-size:.75rem; color:var(--warn); border:1px solid var(--warn); border-radius:6px; padding:1px 6px; margin-bottom:8px; }
    a { color:var(--accent); }
    .disc { color:var(--muted); font-size:.85rem; margin-top:24px; }
    .actions { display:flex; gap:8px; margin-top:16px; }
    @media print { button, .actions { display:none; } body { background:#fff; color:#000; } }
  </style>
</head>
<body>
<main>
  <h1>Assistant déclaration frontaliers</h1>
  <p class="lead">Répondez à quelques questions, obtenez votre checklist de formulaires et de pièces. Vos réponses restent dans votre navigateur.</p>
  <div id="app"></div>
  <p class="disc" id="disc"></p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
